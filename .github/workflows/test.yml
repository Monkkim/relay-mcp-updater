name: Validate updater and authentication
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm test
        working-directory: skills/relay-mcp-updater/assets/server
      - run: python3 skills/relay-mcp-updater/scripts/check_bundle.py
